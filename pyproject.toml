[project]
name = "zlx-data-platform"
version = "0.1.0"
description = "ZLX cross-border ecommerce data platform"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "psycopg[binary]>=3.2.0",
    "pydantic>=2.7.0",
    "pyyaml>=6.0.0",
    "openpyxl>=3.1.0",
]

[tool.pytest.ini_options]
testpaths = [
    "tests",
    "apps/feishu_intake_poc/tests",
    "apps/sku_mapping_poc/tests",
    "apps/sku_source_update_poc/tests",
    "apps/product_sku_management/tests",
]
markers = [
    "integration: tests that call real external systems or services",
    "external: tests that require network or third-party credentials",
]
