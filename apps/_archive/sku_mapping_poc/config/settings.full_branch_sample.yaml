  historical_ordered_platform_skus: apps/sku_mapping_poc/data/samples/full_branch_case/state/历史出单平台SKU表.xlsx
  product_sku_platform_sku_mapping: apps/sku_mapping_poc/data/samples/full_branch_case/state/商品SKU-平台SKU映射关系表.xlsx
  output_dir: apps/sku_mapping_poc/data/samples/full_branch_case/output

